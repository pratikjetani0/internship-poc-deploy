      function App() {
        const [count, setCount] = React.useState(0);
        const buttonRef = React.useRef();

        function increaseCount() {
          setCount(count + 1);
        }

        function resetCount() {
          setCount(0);
        }

        function autoClick() {
          setInterval(() => {
            const btnElm = buttonRef.current;
            if (btnElm) {
              btnElm.click();
            }
          }, 1000);
        }
        return (
           <div className="counter-container">
            <button onClick={increaseCount}  className="counter-button" ref={buttonRef}>
              Clicked {count} {count === 1 ? "time" : "times"}
            </button>
            <button onClick={resetCount} className="counter-button">Reset</button>
            <button onClick={autoClick} className="counter-button">Auto Click</button>
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
