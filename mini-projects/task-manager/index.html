<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>

  <body class="bg-black text-white min-h-screen font-mono">
    <!-- Header -->
    <header
      class="flex justify-between items-center p-4 border-b border-gray-700"
    >
      <h1 class="text-xl font-bold">Task Manager</h1>

      <!-- New Task Button -->
      <button id="openFormBtn" class="bg-blue-500 px-4 py-2 rounded">
        + New Task
      </button>
    </header>

    <!-- App Root -->
    <div id="app" class="p-4"></div>

    <!-- Form Popup -->
    <div id="modalWrapper" class="fixed inset-0 hidden">
      <!-- Backdrop -->
      <div id="modalBackdrop" class="absolute inset-0 bg-black/50"></div>

      <!-- Sidebar Form -->
      <div
        id="formModal"
        class="absolute top-0 right-0 w-80 h-full bg-gray-900 shadow-lg p-4 transform translate-x-full transition-transform"
      ></div>
    </div>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
