<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart System</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="bg-slate-100 min-h-screen">
    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"
      >
        <h1 class="text-2xl font-bold">Mini Shop TS</h1>

        <button
          id="cart-toggle"
          class="relative bg-blue-600 p-3 rounded-lg hover:bg-blue-700 transition cursor-no-drop"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-6 h-6 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1 5h13M10 21a1 1 0 100-2 1 1 0 000 2zm8 0a1 1 0 100-2 1 1 0 000 2z"
            />
          </svg>

          <span
            id="cart-count"
            class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-full"
          >
            0
          </span>
        </button>
      </div>
    </header>

    <!-- Main Layout -->
    <main
      class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8"
    >
      <!-- Product Section -->
      <section class="lg:col-span-3">
        <h2 class="text-2xl font-semibold mb-6">Products</h2>

        <!-- Product Grid -->

        <div
          id="loading"
          class="flex flex-col items-center justify-center py-20"
        >
          <div
            class="w-14 h-14 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
          ></div>

          <p class="mt-4 text-gray-600 text-lg">Loading products...</p>
        </div>

        <div
          id="product-list"
          class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
        >
          <!-- Products rendered here -->
        </div>
      </section>

      <!-- Cart Sidebar -->
      <aside id="cart-sidebar" class="bg-white rounded-xl shadow-lg p-6 h-fit">
        <h2 class="text-xl font-bold mb-4">Shopping Cart</h2>

        <!-- Empty Message -->
        <p id="empty-cart-msg" class="text-gray-500">Your cart is empty</p>

        <!-- Cart Items -->
        <div id="cart-items" class="space-y-5 max-h-100 overflow-y-auto pr-2">
          <!-- Cart items render here -->
        </div>

        <!-- Cart Footer -->
        <div class="mt-6 border-t pt-4">
          <div class="flex justify-between text-lg font-semibold">
            <span>Total:</span>
            <span>₹<span id="cart-total"></span></span>
          </div>

          <button
            id="checkout-btn"
            class="w-full mt-4 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition cursor-pointer"
          >
            Checkout
          </button>
        </div>
      </aside>
    </main>

    <div
      id="success-modal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50"
    >
      <div class="bg-white rounded-2xl shadow-xl p-10 text-center w-112.5">
        <div class="text-7xl mb-6">✅</div>

        <h2 class="text-3xl font-bold text-green-600 mb-4">
          Order Placed Successfully!
        </h2>

        <p class="text-gray-600 text-lg">Thank you for shopping with us</p>
      </div>
    </div>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
